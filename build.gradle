plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.49.0")
    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")
    testImplementation("org.testng:testng:7.12.0")
}

test {
    useTestNG()
}